project_id = "investbw"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://127.0.0.1:5173/reset-password"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Google sign-in ("Continue with Google" on Login/Register) — fill these in
# and set enabled = true once you have OAuth credentials; leave disabled to
# use email/password + OTP only.
[auth.external.google]
enabled = false
client_id = ""
secret = ""

[edge_runtime]
enabled = true

[functions]
[functions.contributeToGoal]
verify_jwt = false
[functions.createGoal]
verify_jwt = false
[functions.executeTrade]
verify_jwt = false
[functions.investAssistant]
verify_jwt = false
[functions.migrateCurrency]
verify_jwt = false
[functions.onboardUser]
verify_jwt = false
[functions.refreshMarketData]
verify_jwt = false
[functions.toggleWatchlist]
verify_jwt = false
